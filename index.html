<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chizzuu Paparaz — Cyber Frame</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #app {
      position: relative;
      width: 960px;
      max-width: 95vw;
      aspect-ratio: 16/10;
      background: #111;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 0 60px rgba(0, 200, 255, 0.15);
    }

    #video, #canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }

    #canvas { pointer-events: none; }

    /* Side info panel */
    .info-panel {
      position: absolute;
      top: 24px; right: 24px;
      background: rgba(10, 20, 35, 0.85);
      border: 1px solid rgba(0, 200, 255, 0.35);
      border-radius: 10px;
      padding: 14px 18px;
      font-size: 12px;
      letter-spacing: 0.5px;
      backdrop-filter: blur(8px);
      z-index: 20;
      min-width: 160px;
    }
    .info-panel .title {
      color: #00c8ff;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 11px;
    }
    .info-panel .row {
      color: #a0c4d8;
      margin: 3px 0;
      font-size: 11px;
    }

    /* Status bar at bottom */
    .status-bar {
      position: absolute;
      bottom: 18px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(0, 200, 255, 0.3);
      border-radius: 30px;
      padding: 8px 22px;
      font-size: 12px;
      color: #7dd3fc;
      z-index: 20;
      white-space: nowrap;
      backdrop-filter: blur(6px);
    }

    /* Signature */
    .signature {
      position: absolute;
      bottom: 70px; right: 28px;
      font-family: 'Brush Script MT', cursive, serif;
      font-size: 22px;
      color: rgba(255, 255, 255, 0.55);
      z-index: 20;
      pointer-events: none;
    }

    /* Camera icon */
    .cam-icon {
      position: absolute;
      bottom: 18px; left: 28px;
      width: 42px; height: 42px;
      border: 2px solid rgba(0, 200, 255, 0.5);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      background: rgba(0, 30, 50, 0.6);
    }
    .cam-icon svg { width: 22px; height: 22px; fill: #00c8ff; }

    /* Loading */
    #loading {
      position: absolute;
      inset: 0;
      background: #0a0a0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      gap: 16px;
    }
    #loading .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(0, 200, 255, 0.2);
      border-top-color: #00c8ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app">
    <div id="loading">
      <div class="spinner"></div>
      <div style="color:#7dd3fc;font-size:14px;">Loading MediaPipe Hand Landmarker…</div>
    </div>

    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>

    <div class="info-panel">
      <div class="title">CAMERA NODE / 02</div>
      <div class="row">SUBJECT</div>
      <div class="row">DETECTION</div>
      <div class="row" style="margin-top:8px;color:#00c8ff;">HAND FRAME AC</div>
    </div>

    <div class="signature">Chizzuu*</div>

    <div class="cam-icon">
      <svg viewBox="0 0 24 24"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4zm8-9.6h-2.4l-1.6-2.4H8l-1.6 2.4H4a2 2 0 0 0-2 2v10.4a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7.6a2 2 0 0 0-2-2z"/></svg>
    </div>

    <div class="status-bar" id="status">BENTUK KOTAK DENGAN DUA TANGAN.</div>
  </div>

  <script type="module">
    import {
      HandLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");
    const loading = document.getElementById("loading");

    let handLandmarker = null;
    let lastVideoTime = -1;
    let running = false;

    // Landmark indices
    const TIP = {
      THUMB: 4,
      INDEX: 8,
      MIDDLE: 12,
      RING: 16,
      PINKY: 20
    };

    async function init() {
      try {
        const vision = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );

        handLandmarker = await HandLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
            delegate: "GPU"
          },
          runningMode: "VIDEO",
          numHands: 2,
          minHandDetectionConfidence: 0.6,
          minHandPresenceConfidence: 0.6,
          minTrackingConfidence: 0.5
        });

        // Start camera
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: { ideal: 1280 },
            height: { ideal: 720 },
            facingMode: "user"
          },
          audio: false
        });
        video.srcObject = stream;
        await video.play();

        // Match canvas size
        function resize() {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
        }
        video.addEventListener("loadedmetadata", resize);
        resize();

        loading.style.display = "none";
        running = true;
        requestAnimationFrame(loop);
      } catch (err) {
        console.error(err);
        loading.innerHTML = `<div style="color:#ff6b6b;padding:20px;text-align:center;">
          Camera / MediaPipe error<br><small>${err.message}</small>
        </div>`;
      }
    }

    function loop() {
      if (!running) return;
      requestAnimationFrame(loop);

      if (video.readyState < 2) return;
      if (video.currentTime === lastVideoTime) return;
      lastVideoTime = video.currentTime;

      const results = handLandmarker.detectForVideo(video, performance.now());
      draw(results);
    }

    function draw(results) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const hands = results.landmarks || [];
      const handedness = results.handednesses || [];

      // Need exactly 2 hands
      if (hands.length < 2) {
        statusEl.textContent = hands.length === 0
          ? "TANGAN BELUM TERDETEKSI"
          : "TANGAN KEDUA BELUM TERLIHAT";
        return;
      }

      // Identify left / right
      let left = null, right = null;
      for (let i = 0; i < hands.length; i++) {
        const label = handedness[i]?.[0]?.categoryName || "";
        if (label === "Left") left = hands[i];
        else if (label === "Right") right = hands[i];
      }

      // Fallback if handedness is missing
      if (!left || !right) {
        left = hands[0];
        right = hands[1];
      }

      // Get the four corner points (index tip + thumb tip of each hand)
      const p1 = left[TIP.INDEX];   // left index
      const p2 = left[TIP.THUMB];   // left thumb
      const p3 = right[TIP.INDEX];  // right index
      const p4 = right[TIP.THUMB];  // right thumb

      // Convert normalized → canvas pixels (mirror because selfie camera)
      const toPx = (pt) => ({
        x: (1 - pt.x) * canvas.width,
        y: pt.y * canvas.height
      });

      const A = toPx(p1); // left index
      const B = toPx(p2); // left thumb
      const C = toPx(p3); // right index
      const D = toPx(p4); // right thumb

      // Decide order of corners so the quad is properly oriented
      // Typical: top-left, top-right, bottom-right, bottom-left
      const corners = orderCorners([A, B, C, D]);

      // Draw the cyber frame
      drawCyberFrame(corners);

      statusEl.textContent = "CYBER FRAME AKTIF. EFEK HANYA DI DALAM KOTAK.";
    }

    // Simple convex-hull-ish ordering so the polygon doesn’t cross
    function orderCorners(pts) {
      // Sort by y then x roughly, then fan around centroid
      const cx = (pts[0].x + pts[1].x + pts[2].x + pts[3].x) / 4;
      const cy = (pts[0].y + pts[1].y + pts[2].y + pts[3].y) / 4;

      return pts.slice().sort((a, b) => {
        const angA = Math.atan2(a.y - cy, a.x - cx);
        const angB = Math.atan2(b.y - cy, b.x - cx);
        return angA - angB;
      });
    }

    function drawCyberFrame(corners) {
      if (corners.length !== 4) return;

      // ---- Outer glow / border ----
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(corners[0].x, corners[0].y);
      for (let i = 1; i < 4; i++) ctx.lineTo(corners[i].x, corners[i].y);
      ctx.closePath();

      // Soft outer glow
      ctx.shadowColor = "rgba(0, 200, 255, 0.7)";
      ctx.shadowBlur = 18;
      ctx.strokeStyle = "rgba(0, 220, 255, 0.95)";
      ctx.lineWidth = 2.5;
      ctx.stroke();

      // Inner bright line
      ctx.shadowBlur = 0;
      ctx.strokeStyle = "rgba(180, 255, 255, 0.9)";
      ctx.lineWidth = 1.2;
      ctx.stroke();

      // ---- Semi-transparent fill with scanlines ----
      ctx.beginPath();
      ctx.moveTo(corners[0].x, corners[0].y);
      for (let i = 1; i < 4; i++) ctx.lineTo(corners[i].x, corners[i].y);
      ctx.closePath();

      // Base fill
      ctx.fillStyle = "rgba(0, 120, 180, 0.18)";
      ctx.fill();

      // Clip to the quadrilateral for scanlines
      ctx.clip();

      // Horizontal scanlines
      const minY = Math.min(...corners.map(p => p.y));
      const maxY = Math.max(...corners.map(p => p.y));
      const minX = Math.min(...corners.map(p => p.x));
      const maxX = Math.max(...corners.map(p => p.x));

      ctx.strokeStyle = "rgba(0, 220, 255, 0.22)";
      ctx.lineWidth = 1;
      const step = 6;
      for (let y = minY; y < maxY; y += step) {
        ctx.beginPath();
        ctx.moveTo(minX - 20, y);
        ctx.lineTo(maxX + 20, y);
        ctx.stroke();
      }

      // Moving highlight line (subtle animation)
      const t = (performance.now() / 30) % (maxY - minY + 40);
      ctx.strokeStyle = "rgba(120, 255, 255, 0.45)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(minX - 20, minY + t);
      ctx.lineTo(maxX + 20, minY + t);
      ctx.stroke();

      ctx.restore();

      // ---- Label ----
      const labelX = (corners[0].x + corners[1].x + corners[2].x + corners[3].x) / 4;
      const labelY = Math.min(...corners.map(p => p.y)) - 18;

      ctx.font = "600 13px 'Segoe UI', system-ui, sans-serif";
      ctx.fillStyle = "rgba(0, 220, 255, 0.95)";
      ctx.textAlign = "center";
      ctx.shadowColor = "rgba(0,0,0,0.8)";
      ctx.shadowBlur = 4;
      ctx.fillText("CYBER FRAME // ACTIVE", labelX, labelY);
      ctx.shadowBlur = 0;

      // Small corner dots
      ctx.fillStyle = "#00e5ff";
      corners.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3.5, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    // Start
    init();
  </script>
</body>
</html>
