<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cyber Frame</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #app {
      position: relative;
      width: min(1280px, 96vw);
      height: min(800px, 92vh);
      background: #000;
      border-radius: 18px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.07),
        0 24px 64px rgba(0,0,0,0.7);
    }

    #video, #gl, #ui {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #video {
      object-fit: cover;
      transform: scaleX(-1);
    }

    #gl, #ui { pointer-events: none; }

    .bar {
      position: absolute;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(12,12,14,0.55);
      backdrop-filter: blur(20px) saturate(140%);
      -webkit-backdrop-filter: blur(20px) saturate(140%);
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 4px 20px rgba(0,0,0,0.35);
    }

    .bar.top-left  { top: 14px; left: 14px; }
    .bar.top-right {
      top: 14px; right: 14px;
      font-size: 11px;
      letter-spacing: 0.9px;
      color: rgba(255,255,255,0.45);
      text-transform: uppercase;
      font-weight: 500;
    }
    .bar.bottom {
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12.5px;
      font-weight: 500;
      color: rgba(255,255,255,0.72);
      white-space: nowrap;
      max-width: 92%;
      letter-spacing: 0.2px;
    }

    .bar label {
      font-size: 10px;
      color: rgba(255,255,255,0.45);
      text-transform: uppercase;
      letter-spacing: 0.7px;
      font-weight: 500;
    }

    input[type="color"] {
      -webkit-appearance: none;
      appearance: none;
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      background: transparent;
      padding: 0;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch {
      border: 2px solid rgba(255,255,255,0.28);
      border-radius: 50%;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent, #00e5ff);
      box-shadow: 0 0 8px var(--accent, #00e5ff);
      transition: background 0.2s, box-shadow 0.2s;
    }

    .dot.active {
      animation: pulse 1.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(0.85); }
    }

    #loading {
      position: absolute;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 100;
      color: rgba(255,255,255,0.4);
      font-size: 13px;
      letter-spacing: 0.3px;
    }
    .spin {
      width: 28px;
      height: 28px;
      border: 2.5px solid rgba(255,255,255,0.08);
      border-top-color: rgba(255,255,255,0.9);
      border-radius: 50%;
      animation: s 0.6s linear infinite;
    }
    @keyframes s { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app">
    <div id="loading">
      <div class="spin"></div>
      <div>Loading</div>
    </div>

    <video id="video" playsinline autoplay muted></video>
    <canvas id="gl"></canvas>
    <canvas id="ui"></canvas>

    <div class="bar top-left">
      <label>Color</label>
      <input type="color" id="colorPicker" value="#00e5ff" />
    </div>

    <div class="bar top-right">
      <div class="dot" id="liveDot"></div>
      <span>Node 02</span>
    </div>

    <div class="bar bottom" id="status">Form a box with index + thumb</div>
  </div>

  <script type="module">
    import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const video = document.getElementById("video");
    const glCanvas = document.getElementById("gl");
    const uiCanvas = document.getElementById("ui");
    const ui = uiCanvas.getContext("2d");
    const statusEl = document.getElementById("status");
    const loading = document.getElementById("loading");
    const colorPicker = document.getElementById("colorPicker");
    const liveDot = document.getElementById("liveDot");

    let handLandmarker = null;
    let lastVideoTime = -1;
    let running = false;
    let accent = [0, 0.898, 1];
    let accentHex = "#00e5ff";

    colorPicker.addEventListener("input", (e) => {
      accentHex = e.target.value;
      accent = [
        parseInt(accentHex.slice(1, 3), 16) / 255,
        parseInt(accentHex.slice(3, 5), 16) / 255,
        parseInt(accentHex.slice(5, 7), 16) / 255
      ];
      liveDot.style.background = accentHex;
      document.documentElement.style.setProperty("--accent", accentHex);
    });

    // Tracking state
    let smooth = null;
    let miss = 0;
    const MAX_MISS = 2; // almost instant hide, tiny flicker buffer
    const TIP = { THUMB: 4, INDEX: 8 };
    const PIP = { INDEX: 6 };
    const PALM = 9;

    // ===== WebGL =====
    const gl = glCanvas.getContext("webgl", {
      alpha: true,
      premultipliedAlpha: false,
      antialias: true
    });

    const VS = `
      attribute vec2 a_pos;
      attribute vec2 a_uv;
      varying vec2 v_uv;
      void main() {
        v_uv = a_uv;
        gl_Position = vec4(a_pos, 0.0, 1.0);
      }
    `;

    const FS = `
      precision mediump float;
      varying vec2 v_uv;
      uniform vec3 u_color;
      uniform float u_time;

      void main() {
        vec2 uv = v_uv;

        // Soft fill
        vec3 col = u_color * 0.18;

        // Fine scanlines
        float scan = 0.62 + 0.38 * sin(uv.y * 280.0 + u_time * 1.6);
        col *= scan;

        // Sweeping beam
        float t = fract(uv.y * 0.65 - u_time * 0.12);
        float beam = smoothstep(0.035, 0.0, abs(t - 0.5) - 0.47);
        col += u_color * beam * 0.4;

        // Edge soft falloff
        float edge = smoothstep(0.0, 0.1, uv.x) * smoothstep(1.0, 0.9, uv.x)
                   * smoothstep(0.0, 0.1, uv.y) * smoothstep(1.0, 0.9, uv.y);
        col *= 0.65 + 0.35 * edge;

        float alpha = 0.5 * edge + 0.12;
        gl_FragColor = vec4(col, alpha);
      }
    `;

    function compile(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      return s;
    }

    const prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(prog);
    gl.useProgram(prog);

    const aPos = gl.getAttribLocation(prog, "a_pos");
    const aUv  = gl.getAttribLocation(prog, "a_uv");
    const uColor = gl.getUniformLocation(prog, "u_color");
    const uTime  = gl.getUniformLocation(prog, "u_time");

    const buf = gl.createBuffer();
    const verts = new Float32Array(24);

    function setQuad(c, W, H) {
      const clip = (p) => [(p.x / W) * 2 - 1, 1 - (p.y / H) * 2];
      const sorted = c.slice().sort((a, b) => a.y - b.y);
      const top = sorted.slice(0, 2).sort((a, b) => a.x - b.x);
      const bot = sorted.slice(2, 4).sort((a, b) => a.x - b.x);
      const [TL, TR, BL, BR] = [top[0], top[1], bot[0], bot[1]];

      const pts = [
        [...clip(TL), 0, 0], [...clip(TR), 1, 0], [...clip(BR), 1, 1],
        [...clip(TL), 0, 0], [...clip(BR), 1, 1], [...clip(BL), 0, 1]
      ];
      for (let i = 0; i < 6; i++) {
        verts[i*4] = pts[i][0]; verts[i*4+1] = pts[i][1];
        verts[i*4+2] = pts[i][2]; verts[i*4+3] = pts[i][3];
      }
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, verts, gl.DYNAMIC_DRAW);
    }

    function drawGL(corners) {
      const W = glCanvas.width, H = glCanvas.height;
      gl.viewport(0, 0, W, H);
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

      setQuad(corners, W, H);
      gl.useProgram(prog);
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.enableVertexAttribArray(aPos);
      gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 16, 0);
      gl.enableVertexAttribArray(aUv);
      gl.vertexAttribPointer(aUv, 2, gl.FLOAT, false, 16, 8);
      gl.uniform3fv(uColor, accent);
      gl.uniform1f(uTime, performance.now() / 1000);
      gl.drawArrays(gl.TRIANGLES, 0, 6);
    }

    function clearGL() {
      gl.viewport(0, 0, glCanvas.width, glCanvas.height);
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
    }

    // ===== 2D border =====
    function drawBorder(corners) {
      const W = uiCanvas.width, H = uiCanvas.height;
      ui.clearRect(0, 0, W, H);

      const col = accentHex;

      ui.save();
      ui.beginPath();
      ui.moveTo(corners[0].x, corners[0].y);
      for (let i = 1; i < 4; i++) ui.lineTo(corners[i].x, corners[i].y);
      ui.closePath();

      ui.shadowColor = col;
      ui.shadowBlur = 16;
      ui.strokeStyle = col;
      ui.lineWidth = 2.4;
      ui.stroke();

      ui.shadowBlur = 0;
      ui.strokeStyle = "rgba(255,255,255,0.9)";
      ui.lineWidth = 1;
      ui.stroke();

      ui.fillStyle = col;
      for (const p of corners) {
        ui.beginPath();
        ui.arc(p.x, p.y, 3.2, 0, Math.PI * 2);
        ui.fill();
      }

      const lx = (corners[0].x + corners[1].x + corners[2].x + corners[3].x) / 4;
      const ly = Math.min(corners[0].y, corners[1].y, corners[2].y, corners[3].y) - 14;
      ui.font = "600 11px system-ui, sans-serif";
      ui.fillStyle = col;
      ui.textAlign = "center";
      ui.shadowColor = "rgba(0,0,0,0.85)";
      ui.shadowBlur = 4;
      ui.fillText("CYBER FRAME // ACTIVE", lx, ly);
      ui.restore();
    }

    function clearUI() {
      ui.clearRect(0, 0, uiCanvas.width, uiCanvas.height);
    }

    // ===== Helpers =====
    function dist(a, b) {
      const dx = a.x - b.x, dy = a.y - b.y;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function palmX(hand) {
      return hand[PALM] ? hand[PALM].x : hand[0].x;
    }

    function isExtended(hand) {
      // Index tip farther from wrist than PIP
      return dist(hand[TIP.INDEX], hand[0]) > dist(hand[PIP.INDEX], hand[0]) * 0.92;
    }

    function orderCorners(pts) {
      const cx = (pts[0].x + pts[1].x + pts[2].x + pts[3].x) / 4;
      const cy = (pts[0].y + pts[1].y + pts[2].y + pts[3].y) / 4;
      return pts.slice().sort((a, b) =>
        Math.atan2(a.y - cy, a.x - cx) - Math.atan2(b.y - cy, b.x - cx)
      );
    }

    function adaptiveSmooth(prev, next) {
      if (!prev) return next.map(p => ({ x: p.x, y: p.y }));
      const out = [];
      for (let i = 0; i < 4; i++) {
        const d = dist(prev[i], next[i]);
        // High speed → follow hard; low speed → stabilize
        const a = d > 28 ? 0.88 : d > 12 ? 0.7 : 0.48;
        out.push({
          x: prev[i].x + (next[i].x - prev[i].x) * a,
          y: prev[i].y + (next[i].y - prev[i].y) * a
        });
      }
      return out;
    }

    // ===== Init =====
    async function init() {
      try {
        const vision = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );
        handLandmarker = await HandLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
            delegate: "GPU"
          },
          runningMode: "VIDEO",
          numHands: 2,
          minHandDetectionConfidence: 0.3,
          minHandPresenceConfidence: 0.3,
          minTrackingConfidence: 0.25
        });

        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: { ideal: 1280 },
            height: { ideal: 720 },
            facingMode: "user",
            frameRate: { ideal: 30 }
          },
          audio: false
        });
        video.srcObject = stream;
        await video.play();

        function resize() {
          const w = video.videoWidth || 1280;
          const h = video.videoHeight || 720;
          glCanvas.width = w;
          glCanvas.height = h;
          uiCanvas.width = w;
          uiCanvas.height = h;
        }
        video.addEventListener("loadedmetadata", resize);
        window.addEventListener("resize", resize);
        resize();

        loading.style.display = "none";
        running = true;
        requestAnimationFrame(loop);
      } catch (err) {
        console.error(err);
        loading.innerHTML =
          `<div style="color:#ff6b6b;text-align:center;padding:20px;font-size:14px">
            Camera error<br><small style="opacity:0.7">${err.message}</small>
          </div>`;
      }
    }

    function loop() {
      if (!running) return;
      requestAnimationFrame(loop);
      if (video.readyState < 2) return;
      if (video.currentTime === lastVideoTime) return;
      lastVideoTime = video.currentTime;

      const results = handLandmarker.detectForVideo(video, performance.now());
      update(results);
    }

    function update(results) {
      const hands = results.landmarks || [];
      let valid = false;
      let corners = null;

      if (hands.length >= 2) {
        // Assign by palm X (more stable than wrist alone)
        // After CSS mirror, larger raw x appears on the left of the screen
        const h0 = hands[0], h1 = hands[1];
        let left, right;
        if (palmX(h0) > palmX(h1)) {
          left = h0; right = h1;
        } else {
          left = h1; right = h0;
        }

        if (isExtended(left) && isExtended(right)) {
          const raw = [
            left[TIP.INDEX],
            left[TIP.THUMB],
            right[TIP.INDEX],
            right[TIP.THUMB]
          ];

          const toPx = (p) => ({
            x: (1 - p.x) * uiCanvas.width,
            y: p.y * uiCanvas.height
          });

          corners = orderCorners(raw.map(toPx));

          const xs = corners.map(p => p.x);
          const ys = corners.map(p => p.y);
          const w = Math.max(...xs) - Math.min(...xs);
          const h = Math.max(...ys) - Math.min(...ys);
          const m = Math.min(uiCanvas.width, uiCanvas.height);

          if (w >= m * 0.065 && h >= m * 0.055) {
            let area = 0;
            for (let i = 0; i < 4; i++) {
              const j = (i + 1) % 4;
              area += corners[i].x * corners[j].y - corners[j].x * corners[i].y;
            }
            if (Math.abs(area) / 2 >= m * m * 0.0025) valid = true;
          }
        }
      }

      if (valid && corners) {
        miss = 0;
        smooth = adaptiveSmooth(smooth, corners);
        drawGL(smooth);
        drawBorder(smooth);
        statusEl.textContent = "Cyber Frame Active";
        liveDot.classList.add("active");
        return;
      }

      // Tiny buffer against single-frame flicker, then instant clear
      if (smooth && miss < MAX_MISS) {
        miss++;
        drawGL(smooth);
        drawBorder(smooth);
        statusEl.textContent = "Cyber Frame Active";
        liveDot.classList.add("active");
        return;
      }

      smooth = null;
      miss = 0;
      clearGL();
      clearUI();
      liveDot.classList.remove("active");

      if (hands.length === 0) statusEl.textContent = "No hands detected";
      else if (hands.length === 1) statusEl.textContent = "Show both hands";
      else statusEl.textContent = "Form a box with index + thumb";
    }

    init();
  </script>
</body>
</html>
