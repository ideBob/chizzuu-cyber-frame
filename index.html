<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chizzuu Paparaz — Cyber Frame</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050508;
      color: #e0e0e0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #app {
      position: relative;
      width: min(1280px, 96vw);
      height: min(800px, 92vh);
      background: #0d0d12;
      border-radius: 20px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(0, 200, 255, 0.15),
        0 0 80px rgba(0, 180, 255, 0.12),
        0 25px 60px rgba(0, 0, 0, 0.6);
    }

    #video, #canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }

    /* Mirror the video so it feels natural (selfie style) */
    #video {
      transform: scaleX(-1);
    }

    #canvas {
      pointer-events: none;
    }

    /* ===== Side info panel (bigger) ===== */
    .info-panel {
      position: absolute;
      top: 28px;
      right: 28px;
      background: rgba(8, 18, 32, 0.88);
      border: 1.5px solid rgba(0, 210, 255, 0.4);
      border-radius: 14px;
      padding: 18px 22px;
      font-size: 14px;
      letter-spacing: 0.6px;
      backdrop-filter: blur(12px);
      z-index: 20;
      min-width: 200px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .info-panel .title {
      color: #00d4ff;
      font-weight: 700;
      margin-bottom: 10px;
      font-size: 13px;
      letter-spacing: 1px;
    }
    .info-panel .row {
      color: #9ec9e0;
      margin: 5px 0;
      font-size: 13px;
    }
    .info-panel .active {
      margin-top: 12px;
      color: #00e5ff;
      font-weight: 600;
      font-size: 13px;
    }

    /* ===== Status bar (bigger) ===== */
    .status-bar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 10, 20, 0.82);
      border: 1.5px solid rgba(0, 200, 255, 0.35);
      border-radius: 40px;
      padding: 12px 32px;
      font-size: 15px;
      font-weight: 500;
      color: #7dd3fc;
      z-index: 20;
      white-space: nowrap;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
      max-width: 90%;
      text-align: center;
    }

    /* ===== Signature ===== */
    .signature {
      position: absolute;
      bottom: 90px;
      right: 36px;
      font-family: 'Brush Script MT', 'Segoe Script', cursive, serif;
      font-size: 28px;
      color: rgba(255, 255, 255, 0.5);
      z-index: 20;
      pointer-events: none;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    /* ===== Camera icon (bigger) ===== */
    .cam-icon {
      position: absolute;
      bottom: 24px;
      left: 32px;
      width: 52px;
      height: 52px;
      border: 2.5px solid rgba(0, 210, 255, 0.55);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      background: rgba(0, 25, 45, 0.7);
      box-shadow: 0 0 20px rgba(0, 180, 255, 0.2);
    }
    .cam-icon svg {
      width: 26px;
      height: 26px;
      fill: #00d4ff;
    }

    /* ===== Loading ===== */
    #loading {
      position: absolute;
      inset: 0;
      background: #050508;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      gap: 20px;
    }
    #loading .spinner {
      width: 48px;
      height: 48px;
      border: 3.5px solid rgba(0, 200, 255, 0.2);
      border-top-color: #00d4ff;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app">
    <div id="loading">
      <div class="spinner"></div>
      <div style="color:#7dd3fc;font-size:16px;letter-spacing:0.5px;">Loading MediaPipe Hand Landmarker…</div>
    </div>

    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>

    <div class="info-panel">
      <div class="title">CAMERA NODE / 02</div>
      <div class="row">SUBJECT</div>
      <div class="row">DETECTION</div>
      <div class="active">HAND FRAME AC</div>
    </div>

    <div class="signature">Chizzuu*</div>

    <div class="cam-icon">
      <svg viewBox="0 0 24 24"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4zm8-9.6h-2.4l-1.6-2.4H8l-1.6 2.4H4a2 2 0 0 0-2 2v10.4a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7.6a2 2 0 0 0-2-2z"/></svg>
    </div>

    <div class="status-bar" id="status">BENTUK KOTAK DENGAN DUA TANGAN.</div>
  </div>

  <script type="module">
    import {
      HandLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");
    const loading = document.getElementById("loading");

    let handLandmarker = null;
    let lastVideoTime = -1;
    let running = false;

    // Smoothed corner positions (for stable tracking)
    let smoothCorners = null;
    const SMOOTH = 0.45; // 0 = no smooth, 1 = freeze (0.4–0.55 feels good)

    // Landmark indices
    const TIP = {
      THUMB: 4,
      INDEX: 8
    };

    async function init() {
      try {
        const vision = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );

        handLandmarker = await HandLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
            delegate: "GPU"
          },
          runningMode: "VIDEO",
          numHands: 2,
          minHandDetectionConfidence: 0.45,
          minHandPresenceConfidence: 0.45,
          minTrackingConfidence: 0.4
        });

        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: { ideal: 1280 },
            height: { ideal: 720 },
            facingMode: "user"
          },
          audio: false
        });
        video.srcObject = stream;
        await video.play();

        function resize() {
          canvas.width = video.videoWidth || 1280;
          canvas.height = video.videoHeight || 720;
        }
        video.addEventListener("loadedmetadata", resize);
        window.addEventListener("resize", resize);
        resize();

        loading.style.display = "none";
        running = true;
        requestAnimationFrame(loop);
      } catch (err) {
        console.error(err);
        loading.innerHTML = `<div style="color:#ff6b6b;padding:24px;text-align:center;font-size:15px;">
          Camera / MediaPipe error<br><small style="opacity:0.8">${err.message}</small>
        </div>`;
      }
    }

    function loop() {
      if (!running) return;
      requestAnimationFrame(loop);

      if (video.readyState < 2) return;
      if (video.currentTime === lastVideoTime) return;
      lastVideoTime = video.currentTime;

      const results = handLandmarker.detectForVideo(video, performance.now());
      draw(results);
    }

    function draw(results) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const hands = results.landmarks || [];

      if (hands.length < 2) {
        smoothCorners = null; // reset smoothing when hands disappear
        statusEl.textContent = hands.length === 0
          ? "TANGAN BELUM TERDETEKSI"
          : "TANGAN KEDUA BELUM TERLIHAT";
        return;
      }

      // -------------------------------------------------------
      // Better hand assignment by SCREEN position
      // Because the video is mirrored with CSS, MediaPipe still
      // sees the un-mirrored image. We therefore use the raw
      // landmark x to decide which hand is on the left/right
      // of the *mirrored* view.
      // -------------------------------------------------------
      const handA = hands[0];
      const handB = hands[1];

      // Average x of each hand (wrist is landmark 0)
      const avgX0 = handA[0].x;
      const avgX1 = handB[0].x;

      // In the mirrored display, the hand that has LARGER raw x
      // appears on the LEFT side of the screen.
      let leftHand, rightHand;
      if (avgX0 > avgX1) {
        leftHand  = handA; // appears on left after mirror
        rightHand = handB;
      } else {
        leftHand  = handB;
        rightHand = handA;
      }

      // Four corner points (index tip + thumb tip)
      const rawPoints = [
        leftHand[TIP.INDEX],
        leftHand[TIP.THUMB],
        rightHand[TIP.INDEX],
        rightHand[TIP.THUMB]
      ];

      // Convert to canvas pixels.
      // Because #video is CSS-mirrored, we also mirror x here
      // so the overlay matches what the user sees.
      const toPx = (pt) => ({
        x: (1 - pt.x) * canvas.width,
        y: pt.y * canvas.height
      });

      let corners = rawPoints.map(toPx);

      // Order corners clockwise around the centroid so the
      // polygon never crosses itself.
      corners = orderCorners(corners);

      // Exponential smoothing for buttery tracking
      if (!smoothCorners) {
        smoothCorners = corners.map(p => ({ x: p.x, y: p.y }));
      } else {
        for (let i = 0; i < 4; i++) {
          smoothCorners[i].x += (corners[i].x - smoothCorners[i].x) * SMOOTH;
          smoothCorners[i].y += (corners[i].y - smoothCorners[i].y) * SMOOTH;
        }
      }

      drawCyberFrame(smoothCorners);
      statusEl.textContent = "CYBER FRAME AKTIF. EFEK HANYA DI DALAM KOTAK.";
    }

    function orderCorners(pts) {
      const cx = (pts[0].x + pts[1].x + pts[2].x + pts[3].x) / 4;
      const cy = (pts[0].y + pts[1].y + pts[2].y + pts[3].y) / 4;

      return pts.slice().sort((a, b) => {
        return Math.atan2(a.y - cy, a.x - cx) - Math.atan2(b.y - cy, b.x - cx);
      });
    }

    function drawCyberFrame(corners) {
      if (!corners || corners.length !== 4) return;

      ctx.save();

      // Outer glow path
      ctx.beginPath();
      ctx.moveTo(corners[0].x, corners[0].y);
      for (let i = 1; i < 4; i++) ctx.lineTo(corners[i].x, corners[i].y);
      ctx.closePath();

      // Soft outer glow
      ctx.shadowColor = "rgba(0, 210, 255, 0.75)";
      ctx.shadowBlur = 22;
      ctx.strokeStyle = "rgba(0, 230, 255, 0.95)";
      ctx.lineWidth = 3.2;
      ctx.stroke();

      // Bright inner line
      ctx.shadowBlur = 0;
      ctx.strokeStyle = "rgba(180, 255, 255, 0.95)";
      ctx.lineWidth = 1.4;
      ctx.stroke();

      // Fill + scanlines
      ctx.beginPath();
      ctx.moveTo(corners[0].x, corners[0].y);
      for (let i = 1; i < 4; i++) ctx.lineTo(corners[i].x, corners[i].y);
      ctx.closePath();

      ctx.fillStyle = "rgba(0, 130, 190, 0.2)";
      ctx.fill();

      ctx.clip();

      const minY = Math.min(...corners.map(p => p.y));
      const maxY = Math.max(...corners.map(p => p.y));
      const minX = Math.min(...corners.map(p => p.x));
      const maxX = Math.max(...corners.map(p => p.x));

      // Scanlines
      ctx.strokeStyle = "rgba(0, 230, 255, 0.25)";
      ctx.lineWidth = 1.1;
      const step = 7;
      for (let y = minY; y < maxY; y += step) {
        ctx.beginPath();
        ctx.moveTo(minX - 30, y);
        ctx.lineTo(maxX + 30, y);
        ctx.stroke();
      }

      // Moving highlight
      const range = Math.max(40, maxY - minY);
      const t = (performance.now() / 28) % (range + 50);
      ctx.strokeStyle = "rgba(140, 255, 255, 0.5)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(minX - 30, minY + t);
      ctx.lineTo(maxX + 30, minY + t);
      ctx.stroke();

      ctx.restore();

      // Label
      const labelX = (corners[0].x + corners[1].x + corners[2].x + corners[3].x) / 4;
      const labelY = Math.min(...corners.map(p => p.y)) - 22;

      ctx.font = "700 15px 'Segoe UI', system-ui, sans-serif";
      ctx.fillStyle = "rgba(0, 235, 255, 0.98)";
      ctx.textAlign = "center";
      ctx.shadowColor = "rgba(0,0,0,0.85)";
      ctx.shadowBlur = 6;
      ctx.fillText("CYBER FRAME // ACTIVE", labelX, labelY);
      ctx.shadowBlur = 0;

      // Corner dots
      ctx.fillStyle = "#00eaff";
      corners.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4.5, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    init();
  </script>
</body>
</html>
