<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chizzuu Paparaz — Cyber Frame</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #e8e8e8;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #app {
      position: relative;
      width: min(1280px, 96vw);
      height: min(800px, 92vh);
      background: #050505;
      border-radius: 22px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.06),
        0 25px 60px rgba(0, 0, 0, 0.85),
        0 0 100px rgba(0, 0, 0, 0.5);
    }

    #video, #canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }

    #video {
      transform: scaleX(-1);
    }

    #canvas {
      pointer-events: none;
    }

    /* ========== Shared Glassmorphism Base ========== */
    .glass {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(22px) saturate(160%);
      -webkit-backdrop-filter: blur(22px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.12),
        inset 0 -1px 0 rgba(0, 0, 0, 0.15);
    }

    /* ===== Info Panel ===== */
    .info-panel {
      position: absolute;
      top: 24px;
      right: 24px;
      border-radius: 16px;
      padding: 18px 22px;
      font-size: 13px;
      letter-spacing: 0.4px;
      z-index: 20;
      min-width: 190px;
    }
    .info-panel .title {
      color: #fff;
      font-weight: 700;
      margin-bottom: 10px;
      font-size: 12px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      opacity: 0.95;
    }
    .info-panel .row {
      color: rgba(255, 255, 255, 0.55);
      margin: 5px 0;
      font-size: 12.5px;
    }
    .info-panel .active {
      margin-top: 12px;
      color: var(--accent, #00e5ff);
      font-weight: 600;
      font-size: 12.5px;
      letter-spacing: 0.6px;
    }

    /* ===== Color Panel ===== */
    .color-panel {
      position: absolute;
      top: 24px;
      left: 24px;
      border-radius: 16px;
      padding: 12px 16px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .color-panel label {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.65);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      font-weight: 500;
    }
    .color-panel input[type="color"] {
      -webkit-appearance: none;
      appearance: none;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      cursor: pointer;
      background: transparent;
      padding: 0;
    }
    .color-panel input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }
    .color-panel input[type="color"]::-webkit-color-swatch {
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    /* ===== Status Bar ===== */
    .status-bar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 50px;
      padding: 12px 30px;
      font-size: 14px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.82);
      z-index: 20;
      white-space: nowrap;
      max-width: 92%;
      text-align: center;
      letter-spacing: 0.3px;
    }

    /* ===== Signature ===== */
    .signature {
      position: absolute;
      bottom: 90px;
      right: 34px;
      font-family: 'Brush Script MT', 'Segoe Script', cursive, serif;
      font-size: 26px;
      color: rgba(255, 255, 255, 0.32);
      z-index: 20;
      pointer-events: none;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    /* ===== Camera Icon ===== */
    .cam-icon {
      position: absolute;
      bottom: 24px;
      left: 28px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }
    .cam-icon svg {
      width: 24px;
      height: 24px;
      fill: rgba(255, 255, 255, 0.75);
    }

    /* ===== Loading ===== */
    #loading {
      position: absolute;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      gap: 20px;
    }
    #loading .spinner {
      width: 46px;
      height: 46px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: rgba(255, 255, 255, 0.85);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app">
    <div id="loading">
      <div class="spinner"></div>
      <div style="color:rgba(255,255,255,0.55);font-size:15px;letter-spacing:0.5px;">Loading MediaPipe…</div>
    </div>

    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>

    <div class="color-panel glass">
      <label>Frame</label>
      <input type="color" id="colorPicker" value="#00e5ff" title="Change frame color" />
    </div>

    <div class="info-panel glass">
      <div class="title">Camera Node / 02</div>
      <div class="row">Subject</div>
      <div class="row">Detection</div>
      <div class="active" id="frameStatus">Hand Frame AC</div>
    </div>

    <div class="signature">Chizzuu*</div>

    <div class="cam-icon glass">
      <svg viewBox="0 0 24 24"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4zm8-9.6h-2.4l-1.6-2.4H8l-1.6 2.4H4a2 2 0 0 0-2 2v10.4a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7.6a2 2 0 0 0-2-2z"/></svg>
    </div>

    <div class="status-bar glass" id="status">BENTUK KOTAK DENGAN JARI TELUNJUK + IBU JARI</div>
  </div>

  <script type="module">
    import {
      HandLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");
    const loading = document.getElementById("loading");
    const colorPicker = document.getElementById("colorPicker");
    const frameStatus = document.getElementById("frameStatus");

    let handLandmarker = null;
    let lastVideoTime = -1;
    let running = false;

    let accent = "#00e5ff";
    colorPicker.addEventListener("input", (e) => {
      accent = e.target.value;
      document.documentElement.style.setProperty("--accent", accent);
      frameStatus.style.color = accent;
    });
    document.documentElement.style.setProperty("--accent", accent);

    let smoothCorners = null;
    const SMOOTH = 0.42;

    const TIP = { THUMB: 4, INDEX: 8 };
    const PIP = { INDEX: 6 };

    async function init() {
      try {
        const vision = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );

        handLandmarker = await HandLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
            delegate: "GPU"
          },
          runningMode: "VIDEO",
          numHands: 2,
          minHandDetectionConfidence: 0.5,
          minHandPresenceConfidence: 0.5,
          minTrackingConfidence: 0.45
        });

        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: { ideal: 1280 },
            height: { ideal: 720 },
            facingMode: "user"
          },
          audio: false
        });
        video.srcObject = stream;
        await video.play();

        function resize() {
          canvas.width = video.videoWidth || 1280;
          canvas.height = video.videoHeight || 720;
        }
        video.addEventListener("loadedmetadata", resize);
        window.addEventListener("resize", resize);
        resize();

        loading.style.display = "none";
        running = true;
        requestAnimationFrame(loop);
      } catch (err) {
        console.error(err);
        loading.innerHTML = `<div style="color:#ff6b6b;padding:24px;text-align:center;font-size:15px;">
          Camera / MediaPipe error<br><small style="opacity:0.8">${err.message}</small>
        </div>`;
      }
    }

    function loop() {
      if (!running) return;
      requestAnimationFrame(loop);

      if (video.readyState < 2) return;
      if (video.currentTime === lastVideoTime) return;
      lastVideoTime = video.currentTime;

      const results = handLandmarker.detectForVideo(video, performance.now());
      draw(results);
    }

    function dist(a, b) {
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function isIndexExtended(hand) {
      const tip = hand[TIP.INDEX];
      const pip = hand[PIP.INDEX];
      const wrist = hand[0];
      return dist(tip, wrist) > dist(pip, wrist) * 1.05;
    }

    function draw(results) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const hands = results.landmarks || [];

      if (hands.length < 2) {
        smoothCorners = null;
        statusEl.textContent = hands.length === 0
          ? "TANGAN BELUM TERDETEKSI"
          : "TANGAN KEDUA BELUM TERLIHAT";
        return;
      }

      const handA = hands[0];
      const handB = hands[1];
      const avgX0 = handA[0].x;
      const avgX1 = handB[0].x;

      let leftHand, rightHand;
      if (avgX0 > avgX1) {
        leftHand  = handA;
        rightHand = handB;
      } else {
        leftHand  = handB;
        rightHand = handA;
      }

      if (!isIndexExtended(leftHand) || !isIndexExtended(rightHand)) {
        smoothCorners = null;
        statusEl.textContent = "ANGKAT JARI TELUNJUK + IBU JARI (BENTUK KOTAK)";
        return;
      }

      const rawPoints = [
        leftHand[TIP.INDEX],
        leftHand[TIP.THUMB],
        rightHand[TIP.INDEX],
        rightHand[TIP.THUMB]
      ];

      const toPx = (pt) => ({
        x: (1 - pt.x) * canvas.width,
        y: pt.y * canvas.height
      });

      let corners = rawPoints.map(toPx);
      corners = orderCorners(corners);

      const xs = corners.map(p => p.x);
      const ys = corners.map(p => p.y);
      const width  = Math.max(...xs) - Math.min(...xs);
      const height = Math.max(...ys) - Math.min(...ys);
      const minDim = Math.min(canvas.width, canvas.height);

      if (width < minDim * 0.12 || height < minDim * 0.10) {
        smoothCorners = null;
        statusEl.textContent = "LEBARKAN KOTAK DENGAN KEDUA TANGAN";
        return;
      }

      let area = 0;
      for (let i = 0; i < 4; i++) {
        const j = (i + 1) % 4;
        area += corners[i].x * corners[j].y;
        area -= corners[j].x * corners[i].y;
      }
      area = Math.abs(area) / 2;
      if (area < (minDim * 0.12) * (minDim * 0.10) * 0.6) {
        smoothCorners = null;
        statusEl.textContent = "BENTUK KOTAK YANG LEBIH BESAR";
        return;
      }

      if (!smoothCorners) {
        smoothCorners = corners.map(p => ({ x: p.x, y: p.y }));
      } else {
        for (let i = 0; i < 4; i++) {
          smoothCorners[i].x += (corners[i].x - smoothCorners[i].x) * SMOOTH;
          smoothCorners[i].y += (corners[i].y - smoothCorners[i].y) * SMOOTH;
        }
      }

      drawCyberFrame(smoothCorners);
      statusEl.textContent = "CYBER FRAME AKTIF";
    }

    function orderCorners(pts) {
      const cx = (pts[0].x + pts[1].x + pts[2].x + pts[3].x) / 4;
      const cy = (pts[0].y + pts[1].y + pts[2].y + pts[3].y) / 4;
      return pts.slice().sort((a, b) =>
        Math.atan2(a.y - cy, a.x - cx) - Math.atan2(b.y - cy, b.x - cx)
      );
    }

    function hexToRgba(hex, alpha) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r},${g},${b},${alpha})`;
    }

    function drawCyberFrame(corners) {
      if (!corners || corners.length !== 4) return;

      const col = accent;

      ctx.save();

      ctx.beginPath();
      ctx.moveTo(corners[0].x, corners[0].y);
      for (let i = 1; i < 4; i++) ctx.lineTo(corners[i].x, corners[i].y);
      ctx.closePath();

      ctx.shadowColor = hexToRgba(col, 0.7);
      ctx.shadowBlur = 20;
      ctx.strokeStyle = hexToRgba(col, 0.95);
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.shadowBlur = 0;
      ctx.strokeStyle = hexToRgba("#ffffff", 0.85);
      ctx.lineWidth = 1.3;
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(corners[0].x, corners[0].y);
      for (let i = 1; i < 4; i++) ctx.lineTo(corners[i].x, corners[i].y);
      ctx.closePath();
      ctx.fillStyle = hexToRgba(col, 0.15);
      ctx.fill();

      ctx.clip();

      const minY = Math.min(...corners.map(p => p.y));
      const maxY = Math.max(...corners.map(p => p.y));
      const minX = Math.min(...corners.map(p => p.x));
      const maxX = Math.max(...corners.map(p => p.x));

      ctx.strokeStyle = hexToRgba(col, 0.22);
      ctx.lineWidth = 1;
      for (let y = minY; y < maxY; y += 7) {
        ctx.beginPath();
        ctx.moveTo(minX - 20, y);
        ctx.lineTo(maxX + 20, y);
        ctx.stroke();
      }

      const range = Math.max(30, maxY - minY);
      const t = (performance.now() / 28) % (range + 40);
      ctx.strokeStyle = hexToRgba(col, 0.45);
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(minX - 20, minY + t);
      ctx.lineTo(maxX + 20, minY + t);
      ctx.stroke();

      ctx.restore();

      const labelX = (corners[0].x + corners[1].x + corners[2].x + corners[3].x) / 4;
      const labelY = Math.min(...corners.map(p => p.y)) - 20;

      ctx.font = "700 14px 'Segoe UI', system-ui, sans-serif";
      ctx.fillStyle = hexToRgba(col, 0.98);
      ctx.textAlign = "center";
      ctx.shadowColor = "rgba(0,0,0,0.9)";
      ctx.shadowBlur = 5;
      ctx.fillText("CYBER FRAME // ACTIVE", labelX, labelY);
      ctx.shadowBlur = 0;

      ctx.fillStyle = col;
      corners.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4.2, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    init();
  </script>
</body>
</html>
