<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyber Frame</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #app {
      position: relative;
      width: min(1280px, 96vw);
      height: min(800px, 92vh);
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.06);
    }

    #video, #gl, #ui {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #video {
      object-fit: cover;
      transform: scaleX(-1);
    }

    #gl, #ui {
      pointer-events: none;
    }

    /* ===== Minimal clean controls ===== */
    .bar {
      position: absolute;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 12px;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.1);
    }

    .bar.top-left {
      top: 12px;
      left: 12px;
    }

    .bar.top-right {
      top: 12px;
      right: 12px;
      font-size: 11px;
      letter-spacing: 0.8px;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
    }

    .bar.bottom {
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: rgba(255,255,255,0.7);
      white-space: nowrap;
      max-width: 90%;
    }

    .bar label {
      font-size: 10px;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    input[type="color"] {
      -webkit-appearance: none;
      appearance: none;
      border: none;
      width: 26px;
      height: 26px;
      border-radius: 7px;
      cursor: pointer;
      background: transparent;
      padding: 0;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch {
      border: 1.5px solid rgba(255,255,255,0.25);
      border-radius: 6px;
    }

    .btn {
      font: 600 11px system-ui, sans-serif;
      letter-spacing: 0.3px;
      color: rgba(255,255,255,0.65);
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 4px 2px;
      transition: color 0.15s;
    }
    .btn:hover { color: #fff; }
    .btn.on { color: #ff5c5c; }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent, #00e5ff);
      margin-right: 2px;
    }

    #loading {
      position: absolute;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 100;
      color: rgba(255,255,255,0.45);
      font-size: 13px;
    }
    .spin {
      width: 32px;
      height: 32px;
      border: 2.5px solid rgba(255,255,255,0.1);
      border-top-color: #fff;
      border-radius: 50%;
      animation: s 0.65s linear infinite;
    }
    @keyframes s { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app">
    <div id="loading">
      <div class="spin"></div>
      <div>Loading…</div>
    </div>

    <video id="video" playsinline autoplay muted></video>
    <canvas id="gl"></canvas>
    <canvas id="ui"></canvas>

    <div class="bar top-left">
      <label>Color</label>
      <input type="color" id="colorPicker" value="#00e5ff" />
      <button class="btn" id="glitchBtn" type="button">Glitch Off</button>
    </div>

    <div class="bar top-right">
      <div class="dot" id="liveDot"></div>
      <span id="nodeLabel">Node 02</span>
    </div>

    <div class="bar bottom" id="status">Form a box with index + thumb</div>
  </div>

  <script type="module">
    import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const video = document.getElementById("video");
    const glCanvas = document.getElementById("gl");
    const uiCanvas = document.getElementById("ui");
    const ui = uiCanvas.getContext("2d");
    const statusEl = document.getElementById("status");
    const loading = document.getElementById("loading");
    const colorPicker = document.getElementById("colorPicker");
    const glitchBtn = document.getElementById("glitchBtn");
    const liveDot = document.getElementById("liveDot");

    let handLandmarker = null;
    let lastVideoTime = -1;
    let running = false;
    let glitchOn = false;
    let accent = [0, 0.9, 1]; // rgb 0-1

    colorPicker.addEventListener("input", (e) => {
      const h = e.target.value;
      accent = [
        parseInt(h.slice(1, 3), 16) / 255,
        parseInt(h.slice(3, 5), 16) / 255,
        parseInt(h.slice(5, 7), 16) / 255
      ];
      liveDot.style.background = h;
      document.documentElement.style.setProperty("--accent", h);
    });

    glitchBtn.addEventListener("click", () => {
      glitchOn = !glitchOn;
      glitchBtn.classList.toggle("on", glitchOn);
      glitchBtn.textContent = glitchOn ? "Glitch On" : "Glitch Off";
    });

    // Tracking — no grace period (instant hide)
    let smooth = null;
    const TIP = { THUMB: 4, INDEX: 8 };
    const PIP = { INDEX: 6 };
    const BASE = 0.6;
    const FAST = 0.85;

    // ===== WebGL setup =====
    const gl = glCanvas.getContext("webgl", { alpha: true, premultipliedAlpha: false, antialias: true });
    if (!gl) alert("WebGL not supported");

    const VS = `
      attribute vec2 a_pos;
      attribute vec2 a_uv;
      varying vec2 v_uv;
      void main() {
        v_uv = a_uv;
        gl_Position = vec4(a_pos, 0.0, 1.0);
      }
    `;

    const FS = `
      precision mediump float;
      varying vec2 v_uv;
      uniform vec3 u_color;
      uniform float u_time;
      uniform float u_glitch;

      float hash(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
      }

      void main() {
        vec2 uv = v_uv;

        // Base tint
        vec3 col = u_color * 0.22;

        // Scanlines
        float scan = 0.55 + 0.45 * sin(uv.y * 220.0 + u_time * 2.0);
        col *= scan;

        // Moving beam
        float beam = smoothstep(0.02, 0.0, abs(fract(uv.y * 0.8 - u_time * 0.15) - 0.5) - 0.48);
        col += u_color * beam * 0.35;

        // Soft vignette toward edges of quad
        float edge = smoothstep(0.0, 0.08, uv.x) * smoothstep(1.0, 0.92, uv.x)
                   * smoothstep(0.0, 0.08, uv.y) * smoothstep(1.0, 0.92, uv.y);
        col *= 0.7 + 0.3 * edge;

        // Glitch / TV static
        if (u_glitch > 0.5) {
          float n = hash(uv * 40.0 + floor(u_time * 24.0));
          col += vec3(n) * 0.18;

          // Horizontal tear
          float tear = step(0.97, hash(vec2(floor(u_time * 10.0), floor(uv.y * 30.0))));
          col += tear * 0.2;

          // RGB split
          float shift = (hash(vec2(u_time, 1.0)) - 0.5) * 0.03 * u_glitch;
          col.r += hash(uv + vec2(shift, 0.0)) * 0.08;
          col.b += hash(uv - vec2(shift, 0.0)) * 0.08;
        }

        // Alpha: stronger in center, soft
        float alpha = 0.55 * edge + 0.15;
        if (u_glitch > 0.5) alpha += 0.08;

        gl_FragColor = vec4(col, alpha);
      }
    `;

    function compile(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        console.error(gl.getShaderInfoLog(s));
      }
      return s;
    }

    const prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(prog);
    gl.useProgram(prog);

    const aPos = gl.getAttribLocation(prog, "a_pos");
    const aUv = gl.getAttribLocation(prog, "a_uv");
    const uColor = gl.getUniformLocation(prog, "u_color");
    const uTime = gl.getUniformLocation(prog, "u_time");
    const uGlitch = gl.getUniformLocation(prog, "u_glitch");

    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);

    // pos.x pos.y uv.x uv.y  (2 triangles)
    const verts = new Float32Array(24);

    function setQuad(corners, W, H) {
      // corners ordered clockwise; map to clip space (-1..1)
      // We use order: TL, TR, BR, BL approximately via sorted corners
      const toClip = (p) => [ (p.x / W) * 2 - 1, 1 - (p.y / H) * 2 ];

      // Assign UVs by sorting into roughly TL TR BR BL
      const sorted = corners.slice().sort((a, b) => a.y - b.y);
      const top = sorted.slice(0, 2).sort((a, b) => a.x - b.x);
      const bot = sorted.slice(2, 4).sort((a, b) => a.x - b.x);
      const TL = top[0], TR = top[1], BL = bot[0], BR = bot[1];

      const pts = [
        [...toClip(TL), 0, 0],
        [...toClip(TR), 1, 0],
        [...toClip(BR), 1, 1],
        [...toClip(TL), 0, 0],
        [...toClip(BR), 1, 1],
        [...toClip(BL), 0, 1]
      ];

      for (let i = 0; i < 6; i++) {
        verts[i * 4]     = pts[i][0];
        verts[i * 4 + 1] = pts[i][1];
        verts[i * 4 + 2] = pts[i][2];
        verts[i * 4 + 3] = pts[i][3];
      }
      gl.bufferData(gl.ARRAY_BUFFER, verts, gl.DYNAMIC_DRAW);
    }

    function drawGL(corners) {
      const W = glCanvas.width;
      const H = glCanvas.height;
      gl.viewport(0, 0, W, H);
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

      setQuad(corners, W, H);

      gl.useProgram(prog);
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.enableVertexAttribArray(aPos);
      gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 16, 0);
      gl.enableVertexAttribArray(aUv);
      gl.vertexAttribPointer(aUv, 2, gl.FLOAT, false, 16, 8);

      gl.uniform3fv(uColor, accent);
      gl.uniform1f(uTime, performance.now() / 1000);
      gl.uniform1f(uGlitch, glitchOn ? 1.0 : 0.0);

      gl.drawArrays(gl.TRIANGLES, 0, 6);
    }

    function clearGL() {
      gl.viewport(0, 0, glCanvas.width, glCanvas.height);
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
    }

    // ===== 2D border / label =====
    function drawBorder(corners) {
      const W = uiCanvas.width;
      const H = uiCanvas.height;
      ui.clearRect(0, 0, W, H);

      const col = `rgb(${accent[0]*255|0},${accent[1]*255|0},${accent[2]*255|0})`;

      ui.save();
      ui.beginPath();
      ui.moveTo(corners[0].x, corners[0].y);
      for (let i = 1; i < 4; i++) ui.lineTo(corners[i].x, corners[i].y);
      ui.closePath();

      ui.shadowColor = col;
      ui.shadowBlur = 18;
      ui.strokeStyle = col;
      ui.lineWidth = 2.5;
      ui.stroke();

      ui.shadowBlur = 0;
      ui.strokeStyle = "rgba(255,255,255,0.85)";
      ui.lineWidth = 1.1;
      ui.stroke();

      // corners
      ui.fillStyle = col;
      corners.forEach(p => {
        ui.beginPath();
        ui.arc(p.x, p.y, 3.5, 0, Math.PI * 2);
        ui.fill();
      });

      // label
      const lx = (corners[0].x + corners[1].x + corners[2].x + corners[3].x) / 4;
      const ly = Math.min(...corners.map(p => p.y)) - 16;
      ui.font = "600 12px system-ui, sans-serif";
      ui.fillStyle = col;
      ui.textAlign = "center";
      ui.shadowColor = "rgba(0,0,0,0.8)";
      ui.shadowBlur = 4;
      ui.fillText("CYBER FRAME // ACTIVE", lx, ly);
      ui.restore();
    }

    function clearUI() {
      ui.clearRect(0, 0, uiCanvas.width, uiCanvas.height);
    }

    // ===== Tracking helpers =====
    function dist(a, b) {
      const dx = a.x - b.x, dy = a.y - b.y;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function isExtended(hand) {
      return dist(hand[TIP.INDEX], hand[0]) > dist(hand[PIP.INDEX], hand[0]) * 0.95;
    }

    function orderCorners(pts) {
      const cx = (pts[0].x + pts[1].x + pts[2].x + pts[3].x) / 4;
      const cy = (pts[0].y + pts[1].y + pts[2].y + pts[3].y) / 4;
      return pts.slice().sort((a, b) =>
        Math.atan2(a.y - cy, a.x - cx) - Math.atan2(b.y - cy, b.x - cx)
      );
    }

    function avgMove(a, b) {
      if (!a || !b) return 0;
      let t = 0;
      for (let i = 0; i < 4; i++) t += dist(a[i], b[i]);
      return t / 4;
    }

    // ===== Main =====
    async function init() {
      try {
        const vision = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );
        handLandmarker = await HandLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
            delegate: "GPU"
          },
          runningMode: "VIDEO",
          numHands: 2,
          minHandDetectionConfidence: 0.32,
          minHandPresenceConfidence: 0.32,
          minTrackingConfidence: 0.28
        });

        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" },
          audio: false
        });
        video.srcObject = stream;
        await video.play();

        function resize() {
          const w = video.videoWidth || 1280;
          const h = video.videoHeight || 720;
          glCanvas.width = w;
          glCanvas.height = h;
          uiCanvas.width = w;
          uiCanvas.height = h;
        }
        video.addEventListener("loadedmetadata", resize);
        window.addEventListener("resize", resize);
        resize();

        loading.style.display = "none";
        running = true;
        requestAnimationFrame(loop);
      } catch (err) {
        console.error(err);
        loading.innerHTML = `<div style="color:#ff6b6b;text-align:center;padding:20px">Camera error<br><small>${err.message}</small></div>`;
      }
    }

    function loop() {
      if (!running) return;
      requestAnimationFrame(loop);
      if (video.readyState < 2) return;
      if (video.currentTime === lastVideoTime) return;
      lastVideoTime = video.currentTime;

      const results = handLandmarker.detectForVideo(video, performance.now());
      draw(results);
    }

    function draw(results) {
      const hands = results.landmarks || [];
      let valid = false;
      let corners = null;

      if (hands.length >= 2) {
        const a = hands[0], b = hands[1];
        let left, right;
        if (a[0].x > b[0].x) { left = a; right = b; }
        else { left = b; right = a; }

        if (isExtended(left) && isExtended(right)) {
          const raw = [
            left[TIP.INDEX], left[TIP.THUMB],
            right[TIP.INDEX], right[TIP.THUMB]
          ];
          const toPx = (p) => ({
            x: (1 - p.x) * uiCanvas.width,
            y: p.y * uiCanvas.height
          });
          corners = orderCorners(raw.map(toPx));

          const xs = corners.map(p => p.x);
          const ys = corners.map(p => p.y);
          const w = Math.max(...xs) - Math.min(...xs);
          const h = Math.max(...ys) - Math.min(...ys);
          const m = Math.min(uiCanvas.width, uiCanvas.height);

          if (w >= m * 0.07 && h >= m * 0.06) {
            let area = 0;
            for (let i = 0; i < 4; i++) {
              const j = (i + 1) % 4;
              area += corners[i].x * corners[j].y - corners[j].x * corners[i].y;
            }
            if (Math.abs(area) / 2 >= m * m * 0.003) valid = true;
          }
        }
      }

      if (valid && corners) {
        const move = avgMove(smooth, corners);
        const alpha = move > 20 ? FAST : BASE;

        if (!smooth) {
          smooth = corners.map(p => ({ x: p.x, y: p.y }));
        } else {
          for (let i = 0; i < 4; i++) {
            smooth[i].x += (corners[i].x - smooth[i].x) * alpha;
            smooth[i].y += (corners[i].y - smooth[i].y) * alpha;
          }
        }

        drawGL(smooth);
        drawBorder(smooth);
        statusEl.textContent = "Cyber Frame Active";
        return;
      }

      // Instant hide — no grace period
      smooth = null;
      clearGL();
      clearUI();

      if (hands.length === 0) statusEl.textContent = "No hands detected";
      else if (hands.length === 1) statusEl.textContent = "Show both hands";
      else statusEl.textContent = "Form a box with index + thumb";
    }

    init();
  </script>
</body>
</html>
